<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notice Management - Society Maintenance Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin-notices">
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size: 1.5rem;">🛡️</span>
        <div>
          <div class="sidebar-brand">Society Tracker</div>
          <span class="sidebar-role-badge admin">Admin Portal</span>
        </div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="/admin-dashboard.html" class="sidebar-link">📊 Dashboard</a></li>
        <li><a href="/admin-complaints.html" class="sidebar-link">📂 Manage Complaints</a></li>
        <li><a href="/overdue-complaints.html" class="sidebar-link">⚠️ Overdue Complaints</a></li>
        <li><a href="/admin-notices.html" class="sidebar-link active">📢 Notice Management</a></li>
        <li><a href="/admin-settings.html" class="sidebar-link">⚙️ Settings</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-profile-summary">
          <div class="user-avatar" id="ui-user-avatar" style="background: #dc2626;">A</div>
          <div class="user-info-text">
            <div class="user-name" id="ui-user-name">Admin</div>
            <div class="user-flat" id="ui-user-flat">Society Administrator</div>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm btn-block" style="margin-top: 0.75rem;" onclick="handleLogout()">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <h1 class="page-title-heading">Publish & Manage Society Notices</h1>
      </header>

      <main class="content-body">
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem;">
          <!-- Create Notice Form -->
          <div class="card-container">
            <h2 class="card-title" style="margin-bottom: 1rem;">Publish New Notice</h2>

            <form id="create-notice-form">
              <div class="form-group">
                <label class="form-label" for="notice-title">Notice Title <span style="color: #ef4444;">*</span></label>
                <input type="text" id="notice-title" class="form-control" placeholder="e.g. Lift Maintenance Schedule" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="notice-content">Content / Announcement Details <span style="color: #ef4444;">*</span></label>
                <textarea id="notice-content" class="form-control" placeholder="Enter notice content here..." required style="min-height: 140px;"></textarea>
              </div>

              <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="notice-important" style="width: 18px; height: 18px; cursor: pointer;">
                <label for="notice-important" style="font-size: 0.9rem; font-weight: 600; cursor: pointer;">Mark as Important (Pinned at top & sends Email alert)</label>
              </div>

              <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Publish Notice</button>
            </form>
          </div>

          <!-- Existing Notices List -->
          <div class="card-container">
            <h2 class="card-title" style="margin-bottom: 1rem;">Published Notices</h2>
            <div id="admin-notices-grid" class="notice-grid">
              <p style="grid-column: 1/-1; color: var(--text-muted);">Loading published notices...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
