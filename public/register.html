<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Registration - Society Maintenance Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 540px;">
      <div class="auth-header">
        <div class="logo-badge">📝</div>
        <h1>Resident Account Registration</h1>
        <p>Register your apartment to raise and track maintenance complaints</p>
      </div>

      <div class="auth-toggle">
        <a href="/login.html" class="auth-toggle-btn">Sign In</a>
        <a href="/register.html" class="auth-toggle-btn active">Register Resident</a>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. John Resident" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="10-digit phone" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-flat">Flat / Apartment Number</label>
          <input type="text" id="reg-flat" class="form-control" placeholder="e.g. B-104 or Block C-302" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Complete Registration</button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
